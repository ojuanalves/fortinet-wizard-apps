<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malicious IP Deny</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #000e00;
    --surface:   #001800;
    --surface2:  #002200;
    --border:    #00550030;
    --border-hi: #00cc00;
    --accent:    #00ff41;
    --accent2:   #00cc00;
    --accent3:   #39ff14;
    --text:      #00ff41;
    --text-dim:  #009920;
    --text-muted:#004d00;
    --error:     #ff0040;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'JetBrains Mono', monospace;
    --glow: 0 0 8px #00ff4180, 0 0 20px #00ff4130;
    --glow-sm: 0 0 4px #00ff4160;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Matrix rain grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,65,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,65,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--border-hi);
    padding-bottom: 16px;
  }

  h1 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(20px, 4vw, 28px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: var(--glow);
  }

  h1::before { content: '> '; opacity: 0.5; }

  .subtitle { display: none; }

  /* Input section */
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 0;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,255,65,0.03), 0 0 0 1px #00ff4110;
  }

  /* Window title bar effect */
  .input-card::before {
    content: '[ INPUT CONSOLE ]';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 26px;
    background: var(--accent2);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    line-height: 26px;
  }

  .input-card > * { margin-top: 6px; }
  .input-card > *:first-child { margin-top: 26px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
    margin-top: 20px !important;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::before { content: '// '; }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-hi);
    opacity: 0.3;
  }

  textarea {
    width: 100%;
    background: #000800;
    border: 1px solid var(--border-hi);
    border-radius: 0;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    padding: 14px;
    resize: vertical;
    min-height: 180px;
    outline: none;
    transition: box-shadow 0.2s;
    caret-color: var(--accent);
    text-shadow: var(--glow-sm);
  }

  textarea:focus {
    box-shadow: 0 0 0 1px var(--accent), var(--glow);
  }

  textarea::placeholder { color: var(--text-muted); text-shadow: none; }

  .hint-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .hint {
    background: #000a00;
    border: 1px solid #00550050;
    border-radius: 0;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .hint-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
    box-shadow: var(--glow-sm);
  }

  .hint-dot.cidr   { background: var(--accent2); }
  .hint-dot.single { background: var(--accent); }
  .hint-dot.range  { background: var(--accent3); }

  /* Options row */
  .options-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .group-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 240px;
  }

  .group-input-wrap label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .group-input-wrap label::before { content: '> '; }

  .group-input {
    flex: 1;
    background: #000800;
    border: 1px solid var(--border-hi);
    border-radius: 0;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    text-shadow: var(--glow-sm);
    transition: box-shadow 0.2s;
  }

  .group-input:focus {
    box-shadow: 0 0 0 1px var(--accent), var(--glow);
  }

  /* Generate button */
  .btn-generate {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 0;
    padding: 10px 24px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    text-shadow: var(--glow-sm);
    box-shadow: var(--glow-sm);
  }

  .btn-generate:hover {
    background: var(--accent);
    color: #000;
    text-shadow: none;
    box-shadow: var(--glow);
  }

  .btn-generate:active { opacity: 0.8; }
  .btn-generate svg { width: 14px; height: 14px; }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 11px;
  }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 0;
    padding: 3px 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 1px;
  }

  .stat-pill span {
    font-weight: 700;
    color: var(--accent);
    text-shadow: var(--glow-sm);
  }

  .stat-pill.s, .stat-pill.c, .stat-pill.r { border-color: var(--border-hi); }

  /* Output sections */
  .output-grid { display: grid; gap: 16px; }

  .output-card {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 0;
    overflow: hidden;
    animation: slideUp 0.2s ease both;
    box-shadow: inset 0 0 30px rgba(0,255,65,0.02);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .output-card:nth-child(2) { animation-delay: 0.06s; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 28px;
    border-bottom: 1px solid var(--border-hi);
    background: var(--accent2);
  }

  .output-title {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #000;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .output-title .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    background: #000;
    color: var(--accent);
    border-radius: 0;
  }

  .badge-addr, .badge-grp { background: #000; color: var(--accent); border: none; }

  .btn-copy {
    background: transparent;
    border: 1px solid #000;
    border-radius: 0;
    color: #000;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .btn-copy:hover {
    background: #000;
    color: var(--accent);
  }

  .btn-copy.copied { background: #000; color: var(--accent); }
  .btn-copy svg { width: 11px; height: 11px; }

  .code-block {
    padding: 18px 20px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--accent);
    overflow-x: auto;
    white-space: pre;
    tab-size: 4;
    max-height: 380px;
    overflow-y: auto;
    text-shadow: var(--glow-sm);
    background: #000800;
  }

  .code-block::-webkit-scrollbar { width: 4px; height: 4px; }
  .code-block::-webkit-scrollbar-track { background: transparent; }
  .code-block::-webkit-scrollbar-thumb { background: var(--accent2); }

  /* Syntax highlight classes (kept but unstyled) */
  .kw, .str, .num, .cmd, .cmt, .ip { color: inherit; }

  /* Error state */
  .error-msg {
    background: rgba(255,0,64,0.08);
    border: 1px solid #ff004060;
    border-radius: 0;
    padding: 12px 16px;
    color: var(--error);
    font-size: 12px;
    margin-bottom: 14px;
    display: none;
    letter-spacing: 1px;
  }

  .error-msg::before { content: '[ERROR] '; font-weight: 700; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
  }

  .empty-state svg {
    width: 36px; height: 36px;
    opacity: 0.25;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 4px var(--accent));
  }

  .empty-state p { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #000e00;
    border: 1px solid var(--accent);
    border-radius: 0;
    padding: 10px 18px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    pointer-events: none;
    text-shadow: var(--glow-sm);
    box-shadow: var(--glow);
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Malicious IP Deny</h1>

    </div>
  </header>

  <!-- Input Card -->
  <div class="input-card">
    <div class="section-label">Entrada de IPs</div>

    <textarea id="ipInput" placeholder="Cole os IPs aqui — um por linha:
54.207.21.185/32
52.95.163.0/13
200.170.248.2-200.170.248.5
10.0.0.0/24
192.168.1.1"></textarea>

    <div class="hint-grid">
      <div class="hint">
        <div class="hint-dot single"></div>
        <div><strong>IP único</strong> — 54.207.21.185 ou 54.207.21.185/32</div>
      </div>
      <div class="hint">
        <div class="hint-dot cidr"></div>
        <div><strong>CIDR /31 ou menor</strong> — 10.0.0.0/24, 192.168.0.0/16</div>
      </div>
      <div class="hint">
        <div class="hint-dot range"></div>
        <div><strong>Range</strong> — 200.170.248.2-200.170.248.5</div>
      </div>
    </div>

    <div class="options-row">
      <div class="group-input-wrap">
        <label>Grupo:</label>
        <input type="text" class="group-input" id="groupName" value="GRP_MALICIOUS_IPS" placeholder="Nome do grupo">
      </div>
      <button class="btn-generate" onclick="generate()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Gerar Config
      </button>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- Output -->
  <div id="outputSection">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
      <p>Cole seus IPs e clique em <strong>Gerar Config</strong></p>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  Copiado para a área de transferência!
</div>

<script>
// ─── IP utilities ───────────────────────────────────────────────────────────

function cidrToMask(prefix) {
  const bits = parseInt(prefix);
  const mask = bits === 0 ? 0 : (~0 << (32 - bits)) >>> 0;
  return [
    (mask >>> 24) & 0xFF,
    (mask >>> 16) & 0xFF,
    (mask >>> 8)  & 0xFF,
    mask & 0xFF
  ].join('.');
}

function ipToLong(ip) {
  return ip.split('.').reduce((acc, o) => (acc << 8) + parseInt(o), 0) >>> 0;
}

function longToIp(n) {
  return [
    (n >>> 24) & 0xFF,
    (n >>> 16) & 0xFF,
    (n >>> 8)  & 0xFF,
    n & 0xFF
  ].join('.');
}

function networkAddr(ip, prefix) {
  const mask = parseInt(prefix) === 0 ? 0 : (~0 << (32 - parseInt(prefix))) >>> 0;
  return longToIp(ipToLong(ip) & mask);
}

function isValidIp(ip) {
  return /^(\d{1,3}\.){3}\d{1,3}$/.test(ip) &&
    ip.split('.').every(o => parseInt(o) >= 0 && parseInt(o) <= 255);
}

// ─── Parse each line ─────────────────────────────────────────────────────────

function parseLine(line) {
  line = line.trim();
  if (!line || line.startsWith('#')) return null;

  // Range: x.x.x.x-y.y.y.y
  if (line.includes('-')) {
    const [start, end] = line.split('-').map(s => s.trim());
    if (isValidIp(start) && isValidIp(end)) {
      return { type: 'range', start, end };
    }
  }

  // CIDR
  if (line.includes('/')) {
    const [ip, prefix] = line.split('/');
    const p = parseInt(prefix);
    if (isValidIp(ip) && p >= 0 && p <= 32) {
      if (p === 32) return { type: 'single', ip };
      return { type: 'cidr', ip, prefix: String(p) };
    }
  }

  // Plain IP → treat as /32
  if (isValidIp(line)) {
    return { type: 'single', ip: line };
  }

  return { type: 'error', raw: line };
}

// ─── Build name ───────────────────────────────────────────────────────────────

function buildName(entry) {
  if (entry.type === 'single') return `IP_${entry.ip}`;
  if (entry.type === 'cidr')   return `RD_${networkAddr(entry.ip, entry.prefix)}/${entry.prefix}`;
  if (entry.type === 'range')  return `RANGE_${entry.start}_${entry.end}`;
  return null;
}

// ─── Build address block ──────────────────────────────────────────────────────

function buildAddressBlock(entries) {
  if (entries.length === 0) return '';

  const lines = ['config firewall address'];

  entries.forEach((entry, idx) => {
    const name = buildName(entry);
    if (!name) return;

    if (entry.type === 'single') {
      lines.push(`    edit "${name}"`);
      lines.push(`        set subnet ${entry.ip} 255.255.255.255`);
    } else if (entry.type === 'cidr') {
      const net  = networkAddr(entry.ip, entry.prefix);
      const mask = cidrToMask(entry.prefix);
      lines.push(`    edit "${name}"`);
      lines.push(`        set subnet ${net} ${mask}`);
    } else if (entry.type === 'range') {
      lines.push(`    edit "${name}"`);
      lines.push(`        set type iprange`);
      lines.push(`        set start-ip ${entry.start}`);
      lines.push(`        set end-ip   ${entry.end}`);
    }

    // next between entries, end after last
    if (idx < entries.length - 1) {
      lines.push('    next');
    }
  });

  lines.push('end');
  return lines.join('\n');
}

// ─── Build addrgrp block ──────────────────────────────────────────────────────

function buildGroupBlock(entries, groupName) {
  const names = entries.map(buildName).filter(Boolean);
  if (names.length === 0) return '';

  const memberStr = names.map(n => `"${n}"`).join(' ');
  return [
    'config firewall addrgrp',
    `    edit "${groupName}"`,
    `    append member ${memberStr}`,
    'end'
  ].join('\n');
}

// ─── Syntax highlight ─────────────────────────────────────────────────────────

function highlight(code) {
  return code
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─── Main generate ────────────────────────────────────────────────────────────

function generate() {
  const raw = document.getElementById('ipInput').value;
  const groupName = document.getElementById('groupName').value.trim() || 'GRP_MALICIOUS_IPS';
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) {
    errEl.textContent = 'Cole pelo menos um IP no campo de entrada.';
    errEl.style.display = 'block';
    return;
  }

  const parsed   = lines.map(parseLine).filter(Boolean);
  const errors   = parsed.filter(e => e.type === 'error');
  const valid    = parsed.filter(e => e.type !== 'error');

  if (errors.length) {
    errEl.textContent = `Entradas inválidas ignoradas: ${errors.map(e => e.raw).join(', ')}`;
    errEl.style.display = 'block';
  }

  if (!valid.length) {
    errEl.textContent = 'Nenhuma entrada válida encontrada.';
    errEl.style.display = 'block';
    return;
  }

  const singles = valid.filter(e => e.type === 'single').length;
  const cidrs   = valid.filter(e => e.type === 'cidr').length;
  const ranges  = valid.filter(e => e.type === 'range').length;

  const addrCode  = buildAddressBlock(valid);
  const groupCode = buildGroupBlock(valid, groupName);

  const section = document.getElementById('outputSection');
  section.innerHTML = `
    <div class="stats-bar">
      <div class="stat-pill s">IPs únicos <span>${singles}</span></div>
      <div class="stat-pill c">Subnets CIDR <span>${cidrs}</span></div>
      <div class="stat-pill r">Ranges <span>${ranges}</span></div>
      <div class="stat-pill">Total <span>${valid.length}</span></div>
    </div>

    <div class="output-grid">
      <div class="output-card">
        <div class="output-header">
          <div class="output-title">
            <span class="badge badge-addr">1</span>
            config firewall address
          </div>
        </div>
        <pre class="code-block" id="addrCode">${highlight(addrCode)}</pre>
      </div>

      <div class="output-card">
        <div class="output-header">
          <div class="output-title">
            <span class="badge badge-grp">2</span>
            config firewall addrgrp
          </div>
        </div>
        <pre class="code-block" id="groupCode">${highlight(groupCode)}</pre>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-top:16px;">
      <button class="btn-copy" id="copyBothBtn" onclick="copyBoth(this)" style="padding:8px 20px; font-size:11px; letter-spacing:2px; border:1px solid var(--accent); color:var(--accent); text-transform:uppercase;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copiar tudo
      </button>
    </div>
  `;

  // Store raw for copying
  window._raw = { addrCode, groupCode };
}

// ─── Copy ─────────────────────────────────────────────────────────────────────

function copyBoth(btn) {
  const raw = (window._raw?.addrCode || '') + '\n\n' + (window._raw?.groupCode || '');
  navigator.clipboard.writeText(raw).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg>
      Copiado!
    `;
    showToast();
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copiar tudo
      `;
    }, 2500);
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Allow Enter+Ctrl to generate
document.getElementById('ipInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) generate();
});
</script>
